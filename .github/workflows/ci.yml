name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx turbo ci

      - name: Type check
        run: bunx turbo check

      - name: Test
        run: bunx turbo test --filter=!./apps/framework

  sync-framework:
    name: Sync Framework
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: monorepo

      - uses: actions/checkout@v4
        with:
          repository: bot-ts/framework
          token: ${{ secrets.FACTORY_TOKEN }}
          path: framework

      - name: Sync apps/framework → bot-ts/framework
        run: rsync -av --delete --exclude='.git' monorepo/apps/framework/ framework/

      - name: Commit & push
        working-directory: framework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to sync" || (git commit -m "sync: bot-ts/dev@${{ github.sha }}" && git push)
