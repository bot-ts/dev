name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx turbo ci

      - name: Type check
        run: bunx turbo check

      - name: Test
        run: bunx turbo test

  factory:
    name: Factory
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger factory tests on bot-ts/framework
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FACTORY_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'bot-ts',
              repo: 'framework',
              workflow_id: 'factory.yml',
              ref: 'master'
            })
